<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Tracker</title>
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
</head>
<body>

<h1>Users Location Sharing Live</h1>

<div>
    <button onclick="sharelocation()">
        Share Your Realtime Location Data
    </button>

    <button onclick="stopSharing()">
        Stop Sharing
    </button>
</div>

<p id="content"></p>

<script>
    const socket = io("http://localhost:3000")

    let locationInterval

    let t = document.getElementById("content")

    // store all users' divs
    let users = {}

    socket.on("connect", () => {
        console.log("Connected :", socket.id)
    })

    function sharelocation() {

        if (!navigator.geolocation) {
            alert("Geolocation not supported")
            return
        }

        locationInterval = setInterval(() => {

            navigator.geolocation.getCurrentPosition((postion) => {

                const locationData = {
                    lat: postion.coords.latitude,
                    log: postion.coords.longitude
                }

                console.log(
                    `user ${socket.id}'s location : ${locationData.lat}, ${locationData.log}`
                )

                socket.emit("locationGet", locationData)

            })

        }, 3000)
    }

    function stopSharing() {
        clearInterval(locationInterval)
        console.log("Location sharing stopped")
        socket.disconnect()    }   
socket.on("user_disconnected", (data) => {

    const id = data.id

    console.log("User disconnected:", id)

    if (users[id]) {

        users[id].remove()

        delete users[id]

        console.log(users)
    }
})


    socket.on("BroadcastingLocationData", (data) => {

        // create div only once for each user
        if (!users[data.id]) {

            let content = document.createElement("div")

            content.style.border = "1px solid black"
            content.style.padding = "10px"
            content.style.margin = "10px"

            t.append(content)

            users[data.id] = content
            console.log(users)
        }

        // update that user's own div
        users[data.id].innerHTML = `
            <strong>${data.id}</strong><br>
            Latitude : ${data.lat}<br>
            Longitude : ${data.log}<br>
            Time : ${data.timestamp}
        `
    })
</script>

</body>
</html>
